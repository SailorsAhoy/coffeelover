<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>CoffeePlanets - Your Specialty Coffee Marketplace</title>
    <meta name="description" content="Discover specialty coffee shops, roasters, premium beans, brewing guides, news and equipment all in one place." />

    <meta property="og:title" content="CoffeePlanets - Your Specialty Coffee Marketplace" />
    <meta property="og:description" content="Discover specialty coffee shops, roasters, premium beans, brewing guides, news and equipment all in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://coffeelover.lovable.app/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://coffeelover.lovable.app/og-image.jpg" />


    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CoffeeMart",
        "url": "https://coffeelover.lovable.app",
        "logo": "https://coffeelover.lovable.app/og-image.jpg",
        "description": "Specialty coffee marketplace for shops, roasters, beans, brewing guides, and equipment."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CoffeeMart",
        "url": "https://coffeelover.lovable.app",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://coffeelover.lovable.app/coffee?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
